<div class="loading-overlay" *ngIf="isVisible" [ngClass]="{ 'fade-out': isFadingOut }" (click)="dismissLoader()">
  <!-- Atmospheric Background Image with Opacity -->
  <div class="loader-bg-image"></div>

  <!-- Luxury Golden Border Frame -->
  <div class="luxury-border-frame">
    <div class="corner corner-tl">
      <svg viewBox="0 0 50 50" fill="none" class="corner-svg">
        <path d="M 2 50 V 2 H 50" stroke="#D4A017" stroke-width="2"/>
        <path d="M 8 50 V 8 H 50" stroke="#D4A017" stroke-width="1" stroke-dasharray="2,2"/>
        <path d="M 14 14 C 14 22, 22 14, 28 28" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="3" fill="#D4A017"/>
        <circle cx="22" cy="22" r="2" fill="#D4A017"/>
        <path d="M 8 28 C 18 28, 28 18, 28 8" stroke="#D4A017" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="corner corner-tr">
      <svg viewBox="0 0 50 50" fill="none" class="corner-svg">
        <path d="M 2 50 V 2 H 50" stroke="#D4A017" stroke-width="2"/>
        <path d="M 8 50 V 8 H 50" stroke="#D4A017" stroke-width="1" stroke-dasharray="2,2"/>
        <path d="M 14 14 C 14 22, 22 14, 28 28" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="3" fill="#D4A017"/>
        <circle cx="22" cy="22" r="2" fill="#D4A017"/>
        <path d="M 8 28 C 18 28, 28 18, 28 8" stroke="#D4A017" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="corner corner-bl">
      <svg viewBox="0 0 50 50" fill="none" class="corner-svg">
        <path d="M 2 50 V 2 H 50" stroke="#D4A017" stroke-width="2"/>
        <path d="M 8 50 V 8 H 50" stroke="#D4A017" stroke-width="1" stroke-dasharray="2,2"/>
        <path d="M 14 14 C 14 22, 22 14, 28 28" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="3" fill="#D4A017"/>
        <circle cx="22" cy="22" r="2" fill="#D4A017"/>
        <path d="M 8 28 C 18 28, 28 18, 28 8" stroke="#D4A017" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="corner corner-br">
      <svg viewBox="0 0 50 50" fill="none" class="corner-svg">
        <path d="M 2 50 V 2 H 50" stroke="#D4A017" stroke-width="2"/>
        <path d="M 8 50 V 8 H 50" stroke="#D4A017" stroke-width="1" stroke-dasharray="2,2"/>
        <path d="M 14 14 C 14 22, 22 14, 28 28" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="3" fill="#D4A017"/>
        <circle cx="22" cy="22" r="2" fill="#D4A017"/>
        <path d="M 8 28 C 18 28, 28 18, 28 8" stroke="#D4A017" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="loader-content">
    <!-- Rotating Arabian Geometric Star SVG -->
    <div class="star-container">
      <svg class="arabian-star" viewBox="0 0 100 100" width="80" height="80">
        <polygon points="50,5 63,37 95,50 63,63 50,95 37,63 5,50 37,37" fill="none" stroke="#D4A017" stroke-width="3" />
        <polygon points="50,18 59,41 82,50 59,59 50,82 41,59 18,50 41,41" fill="none" stroke="#8B0000" stroke-width="2" />
        <circle cx="50" cy="50" r="8" fill="#D4A017" />
      </svg>
      <div class="glow-ring"></div>
    </div>
    
    <!-- Branding -->
    <h1 class="loader-title">HIGHWAY GRILL</h1>
    <div class="loader-subtitle-wrapper">
      <span class="line"></span>
      <span class="loader-subtitle">Authentic Arabian Mandhi</span>
      <span class="line"></span>
    </div>
  </div>

  <!-- Scroll Down to Enter Reminder -->
  <div class="scroll-reminder">
    <span class="scroll-text">Scroll Down to Enter</span>
    <div class="scroll-icon-wrapper">
      <svg class="scroll-arrow" viewBox="0 0 24 24" width="24" height="24">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" fill="#D4A017" />
      </svg>
    </div>
  </div>
</div>
