<nav class="navbar" [ngClass]="{ 'scrolled': isScrolled, 'mobile-open': isMobileMenuOpen }">
  <div class="navbar-container">
    <!-- Brand Logo Placeholder -->
    <a routerLink="/" class="navbar-logo" (click)="closeMobileMenu()">
      <div class="logo-icon">
        <span>❖</span>
      </div>
      <div class="logo-text">
        <span class="logo-title">HIGHWAY GRILL</span>
        <span class="logo-subtitle">Authentic Arabian Mandhi</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active">About Us</a></li>
      <li><a routerLink="/menu" routerLinkActive="active">Signature Menu</a></li>
      <li><a routerLink="/gallery" routerLinkActive="active">Gallery</a></li>
      <li><a routerLink="/videos" routerLinkActive="active">Videos</a></li>
      <li><a routerLink="/reviews" routerLinkActive="active">Reviews</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contact Us</a></li>
    </ul>

    <!-- Menu Actions / CTAs -->
    <div class="nav-actions">
      <a routerLink="/reservation" class="nav-btn-gold">Book a Table</a>
    </div>

    <!-- Mobile Burger Toggle Button -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <!-- Mobile Overlay Navigation Drawer -->
  <div class="mobile-drawer" [ngClass]="{ 'open': isMobileMenuOpen }">
    <ul class="mobile-nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a></li>
      <li><a routerLink="/menu" routerLinkActive="active" (click)="closeMobileMenu()">Signature Menu</a></li>
      <li><a routerLink="/gallery" routerLinkActive="active" (click)="closeMobileMenu()">Gallery</a></li>
      <li><a routerLink="/videos" routerLinkActive="active" (click)="closeMobileMenu()">Videos</a></li>
      <li><a routerLink="/reviews" routerLinkActive="active" (click)="closeMobileMenu()">Reviews</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact Us</a></li>
      <li class="mobile-action-li">
        <a routerLink="/reservation" class="nav-btn-gold" (click)="closeMobileMenu()">Book a Table</a>
      </li>
    </ul>
  </div>
</nav>
